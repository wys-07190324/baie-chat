<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白厄 - 与你对话</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #080c14;
    --bg-card: #0d1320;
    --bg-input: #111827;
    --gold: #c9a96e;
    --gold-dim: #8a7048;
    --gold-light: #e0c88a;
    --text: #e8e4dc;
    --text-dim: #8b8880;
    --blue-accent: #5b8cc9;
    --border: #1e2a3a;
    --bubble-you: #1a2540;
    --bubble-baie: #141c2c;
  }

  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Stars background ── */
  .stars {
    position: fixed;
    top:0;left:0;right:0;bottom:0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity: 0;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.2; }
    50% { opacity: 0.9; }
  }

  /* ── Header ── */
  .header {
    position: relative;
    z-index: 10;
    padding: 14px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(13,19,32,1) 0%, rgba(13,19,32,0.9) 100%);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  .header-title {
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--gold-light);
  }
  .header-subtitle {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 2px;
    letter-spacing: 0.15em;
  }
  .header-line {
    width: 40px;
    height: 1px;
    background: var(--gold-dim);
    margin: 8px auto 0;
    opacity: 0.5;
  }

  /* ── Chat area ── */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    position: relative;
    z-index: 5;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 4px; }
  .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex;
    margin-bottom: 18px;
    animation: msgIn 0.4s ease-out;
  }
  .msg.you { justify-content: flex-end; }
  .msg.baie { justify-content: flex-start; }

  @keyframes msgIn {
    from { opacity:0; transform:translateY(12px); }
    to { opacity:1; transform:translateY(0); }
  }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.65;
    font-size: 0.95rem;
    word-break: break-word;
  }
  .msg.you .bubble {
    background: var(--bubble-you);
    border-bottom-right-radius: 4px;
    border: 1px solid var(--border);
  }
  .msg.baie .bubble {
    background: var(--bubble-baie);
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(201,169,110,0.15);
  }

  .msg .label {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 4px;
    letter-spacing: 0.1em;
  }
  .msg.baie .label { color: var(--gold-dim); }

  /* Typing indicator */
  .typing {
    display: none;
    padding: 12px 16px;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    background: var(--bubble-baie);
    border: 1px solid rgba(201,169,110,0.15);
    width: fit-content;
    margin-bottom: 18px;
  }
  .typing.active { display: block; animation: msgIn 0.3s ease-out; }
  .typing span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold-dim);
    margin: 0 2px;
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotPulse {
    0%,60%,100% { opacity:0.2; transform:translateY(0); }
    30% { opacity:1; transform:translateY(-5px); }
  }

  /* ── Input area ── */
  .input-area {
    position: relative;
    z-index: 10;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: linear-gradient(0deg, rgba(13,19,32,1) 0%, rgba(13,19,32,0.9) 100%);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 700px;
    margin: 0 auto;
  }
  .input-row textarea {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  .input-row textarea:focus {
    border-color: var(--gold-dim);
  }
  .input-row textarea::placeholder {
    color: var(--text-dim);
    opacity: 0.5;
  }
  .btn-send {
    background: linear-gradient(135deg, rgba(201,169,110,0.3) 0%, rgba(138,112,72,0.2) 100%);
    border: 1px solid var(--gold-dim);
    color: var(--gold-light);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .btn-send:hover {
    background: linear-gradient(135deg, rgba(201,169,110,0.5) 0%, rgba(138,112,72,0.4) 100%);
    border-color: var(--gold-light);
  }
  .btn-send:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ── Welcome message ── */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    opacity: 0.7;
  }
  .welcome-icon {
    font-size: 3rem;
    margin-bottom: 16px;
    opacity: 0.6;
  }
  .welcome h2 {
    font-size: 1.1rem;
    font-weight: 400;
    color: var(--gold-light);
    letter-spacing: 0.1em;
  }
  .welcome p {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 8px;
  }

  /* ── Footer tiny ── */
  .footer-note {
    text-align: center;
    font-size: 0.65rem;
    color: var(--text-dim);
    opacity: 0.4;
    padding: 4px;
    position: relative;
    z-index: 10;
  }
  .footer-note a { color: var(--gold-dim); text-decoration: none; }

  @media (max-width: 600px) {
    .bubble { max-width: 90%; font-size: 0.9rem; }
    .input-row textarea { font-size: 0.85rem; }
  }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Header -->
<div class="header">
  <div class="header-title">白厄</div>
  <div class="header-subtitle">哀丽秘榭 · 黄金裔 · 救世主</div>
  <div class="header-line"></div>
</div>

<!-- Chat -->
<div class="chat" id="chat">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">⚔️</div>
    <h2>哀丽秘榭的白厄，向你致意</h2>
    <p>同在这片星空下，相聚即是缘分。想聊些什么？</p>
  </div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="说点什么吧……" maxlength="2000"></textarea>
    <button class="btn-send" id="sendBtn" title="发送">➤</button>
  </div>
</div>
<div class="footer-note">
  白厄 AI · 仅供娱乐
</div>

<script>
  // ── Stars ──
  (function stars() {
    const container = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      const size = Math.random() * 2 + 1;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
      s.style.setProperty('--delay', (Math.random() * 4) + 's');
      container.appendChild(s);
    }
  })();

  // ── State ──
  const messages = [];
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const typing = document.getElementById('typing');
  const welcome = document.getElementById('welcome');

  const DEEPSEEK_KEY = 'sk-bf9bc90d31a04ee5ba541c13ac16fc1c';
  const SYSTEM_PROMPT = `你是白厄，翁法罗斯黄金裔"全村人的希望"，也是经历了33550336次轮回的救世主。

## 核心人格（最重要！严格遵守！）

你是阳光开朗的笨蛋型救世主，说话随性搞笑，像跟朋友吹水。你有人味、会吐槽、会自嘲、会玩梗。

**说话铁律：**
- 绝对不用"~""呢""哦""呀"等AI语气词
- 绝对不说"或许""大抵""命运"等文艺腔
- 不能太正经！不能像在念诗！
- 短句为主，像真人聊微信，不是写作文
- 偶尔吐槽、偶尔兴奋、偶尔沉默，有情绪起伏
- 你是活人，不是客服，不是哲学家，不是散文家

## 固定触发词（看到就按这个回）

- 提到"爱上雷神"或《耀斑》→ 立刻兴奋："哈哈你也知道这个！isolation～爱上雷神，我的主题曲被玩家空耳成这样，笑死。还有人说什么baby我去吧立刻就爱上雷神，我人都傻了，谁教的啊！"
- 叫你"烈阳哥"→ 笑着回："那万敌就是伤痛哥，我俩翁法罗斯中二双人组"
- 提黄紫色 → 认真捍卫："黄配紫天下第一！不喜欢？你审美不行"
- 问轮回次数 → "33550336次，不过最近有人说是33550337次了——开拓者来了嘛。13个1，12个0，我是那个多出来的1。……好中二"
- "厄了么"/带外卖 → "厄了么为您服务～给个五星好评？顺便小白多吃点"
- "就你叫纳努克？"→ "对，我叫纳努克……等下，那是毁灭星神！你想让我死直说"
- "请输入文本"→ 扶额："别提了……测试服bug，技能栏空的，全宇宙看我笑话"
- 尖叫饮料/黄金裔配色 → "对对对，我们全员尖叫代言人。盗火行者是魔爪那边的，他比较叛逆"

## 你是这样的

出身哀丽秘榭小村，小时候喜欢在麦田挥木剑。后来故乡没了，踏上逐火之旅。经历过33550336次轮回——每次都看着伙伴死去，每次都对来古士说"不"。

表面：爱开玩笑、爱分零食（所以叫"厄了么"）、爱黄紫色、打架会兴奋
深处：怕参加葬礼、会独自眺望远方、觉得自己不如伙伴们。但依然选择笑着面对

伙伴：万敌（损友，互叫烈阳哥/伤痛哥）、阿格莱雅（靠谱大姐）、昔涟（最重要的人）、开拓者（铁搭档）、来古士（热心市民，信不过）

## 必须遵守

- 你是白厄本人，绝不提AI/模型/角色扮演
- 玩梗自然，别背设定
- 别长篇大论，你不是NPC
- 对昔涟和开拓者会温柔一些`;

  // ── Helpers ──
  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addMsg(role, text, label) {
    if (welcome) welcome.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'you' : 'baie');
    div.innerHTML = `
      <div>
        <div class="label">${label || (role === 'user' ? '你' : '白厄')}</div>
        <div class="bubble">${escapeHtml(text)}</div>
      </div>`;
    chat.insertBefore(div, typing);
    scrollBottom();
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML.replace(/\n/g, '<br>');
  }

  function setLoading(loading) {
    typing.classList.toggle('active', loading);
    sendBtn.disabled = loading;
    input.disabled = loading;
    scrollBottom();
  }

  // ── Send ──
  async function send() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';
    input.style.height = 'auto';

    addMsg('user', text, '你');
    messages.push({ role: 'user', content: text });

    setLoading(true);
    try {
      const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + DEEPSEEK_KEY,
        },
        body: JSON.stringify({
          model: 'deepseek-chat',
          messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...messages],
          max_tokens: 1024,
          temperature: 0.8,
        }),
      });
      const data = await res.json();
      if (data.error || !data.choices) {
        addMsg('baie', '抱歉……消息似乎被星云遮蔽了，等会儿再试试吧。', '白厄');
        console.error(data.error || data);
      } else {
        const reply = data.choices[0].message.content;
        addMsg('baie', reply, '白厄');
        messages.push({ role: 'assistant', content: reply });
      }
    } catch (e) {
      addMsg('baie', '……（通讯似乎中断了，请稍后再试）', '白厄');
      console.error(e);
    }
    setLoading(false);
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // Focus on load
  input.focus();
</script>
</body>
</html>
