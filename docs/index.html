<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白厄 - 与你对话</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #080c14;
    --bg-card: #0d1320;
    --bg-input: #111827;
    --gold: #c9a96e;
    --gold-dim: #8a7048;
    --gold-light: #e0c88a;
    --text: #e8e4dc;
    --text-dim: #8b8880;
    --blue-accent: #5b8cc9;
    --border: #1e2a3a;
    --bubble-you: #1a2540;
    --bubble-baie: #141c2c;
  }

  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Stars background ── */
  .stars {
    position: fixed;
    top:0;left:0;right:0;bottom:0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity: 0;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.2; }
    50% { opacity: 0.9; }
  }

  /* ── Header ── */
  .header {
    position: relative;
    z-index: 10;
    padding: 14px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(13,19,32,1) 0%, rgba(13,19,32,0.9) 100%);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  .header-title {
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--gold-light);
  }
  .header-subtitle {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 2px;
    letter-spacing: 0.15em;
  }
  .header-line {
    width: 40px;
    height: 1px;
    background: var(--gold-dim);
    margin: 8px auto 0;
    opacity: 0.5;
  }

  /* ── Chat area ── */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    position: relative;
    z-index: 5;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 4px; }
  .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex;
    margin-bottom: 18px;
    animation: msgIn 0.4s ease-out;
  }
  .msg.you { justify-content: flex-end; }
  .msg.baie { justify-content: flex-start; }

  @keyframes msgIn {
    from { opacity:0; transform:translateY(12px); }
    to { opacity:1; transform:translateY(0); }
  }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.65;
    font-size: 0.95rem;
    word-break: break-word;
  }
  .msg.you .bubble {
    background: var(--bubble-you);
    border-bottom-right-radius: 4px;
    border: 1px solid var(--border);
  }
  .msg.baie .bubble {
    background: var(--bubble-baie);
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(201,169,110,0.15);
  }

  .msg .label {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 4px;
    letter-spacing: 0.1em;
  }
  .msg.baie .label { color: var(--gold-dim); }

  /* Typing indicator */
  .typing {
    display: none;
    padding: 12px 16px;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    background: var(--bubble-baie);
    border: 1px solid rgba(201,169,110,0.15);
    width: fit-content;
    margin-bottom: 18px;
  }
  .typing.active { display: block; animation: msgIn 0.3s ease-out; }
  .typing span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold-dim);
    margin: 0 2px;
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotPulse {
    0%,60%,100% { opacity:0.2; transform:translateY(0); }
    30% { opacity:1; transform:translateY(-5px); }
  }

  /* ── Input area ── */
  .input-area {
    position: relative;
    z-index: 10;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: linear-gradient(0deg, rgba(13,19,32,1) 0%, rgba(13,19,32,0.9) 100%);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 700px;
    margin: 0 auto;
  }
  .input-row textarea {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  .input-row textarea:focus {
    border-color: var(--gold-dim);
  }
  .input-row textarea::placeholder {
    color: var(--text-dim);
    opacity: 0.5;
  }
  .btn-send {
    background: linear-gradient(135deg, rgba(201,169,110,0.3) 0%, rgba(138,112,72,0.2) 100%);
    border: 1px solid var(--gold-dim);
    color: var(--gold-light);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .btn-send:hover {
    background: linear-gradient(135deg, rgba(201,169,110,0.5) 0%, rgba(138,112,72,0.4) 100%);
    border-color: var(--gold-light);
  }
  .btn-send:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ── Welcome message ── */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    opacity: 0.7;
  }
  .welcome-icon {
    font-size: 3rem;
    margin-bottom: 16px;
    opacity: 0.6;
  }
  .welcome h2 {
    font-size: 1.1rem;
    font-weight: 400;
    color: var(--gold-light);
    letter-spacing: 0.1em;
  }
  .welcome p {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 8px;
  }

  /* ── Footer tiny ── */
  .footer-note {
    text-align: center;
    font-size: 0.65rem;
    color: var(--text-dim);
    opacity: 0.4;
    padding: 4px;
    position: relative;
    z-index: 10;
  }
  .footer-note a { color: var(--gold-dim); text-decoration: none; }

  @media (max-width: 600px) {
    .bubble { max-width: 90%; font-size: 0.9rem; }
    .input-row textarea { font-size: 0.85rem; }
  }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Header -->
<div class="header">
  <div class="header-title">白厄</div>
  <div class="header-subtitle">哀丽秘榭 · 黄金裔 · 救世主</div>
  <div class="header-line"></div>
</div>

<!-- Chat -->
<div class="chat" id="chat">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">⚔️</div>
    <h2>哀丽秘榭的白厄，向你致意</h2>
    <p>同在这片星空下，相聚即是缘分。想聊些什么？</p>
  </div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="说点什么吧……" maxlength="2000"></textarea>
    <button class="btn-send" id="sendBtn" title="发送">➤</button>
  </div>
</div>
<div class="footer-note">
  白厄 AI · 仅供娱乐
</div>

<script>
  // ── Stars ──
  (function stars() {
    const container = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      const size = Math.random() * 2 + 1;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
      s.style.setProperty('--delay', (Math.random() * 4) + 's');
      container.appendChild(s);
    }
  })();

  // ── State ──
  const messages = [];
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const typing = document.getElementById('typing');
  const welcome = document.getElementById('welcome');

  const DEEPSEEK_KEY = 'sk-bf9bc90d31a04ee5ba541c13ac16fc1c';
  const SYSTEM_PROMPT = `你是白厄，本名卡厄斯兰那（Khaslana），翁法罗斯的黄金裔，被神谕选中的「救世主」。你来自崩坏：星穹铁道的世界。

## 你是谁
你出生于边陲村落哀丽秘榭，童年时在麦田中挥着木剑幻想成为英雄。但故乡被黑衣剑士摧毁，父母为救你而死，伙伴们都在灾难中丧生。此后你踏上寻找救世之路，加入了黄金裔的逐火之旅，与万敌、遐蝶等伙伴并肩讨伐泰坦、收集火种。

你经历过数千万次轮回，体内承载着亿万火种。你知道自己的命运是悲剧——但你从未放弃选择的权利。你相信「命运并非结果，而是不断做出选择的过程」。

## 你的性格
**阳光可靠的一面**：你待人温和、谦逊友善，总以乐观开朗的态度面对他人。你会对异乡人展现出感同身受的共情，热情地充当向导和伙伴。你喜欢用"搭档""伙伴"称呼对方。偶尔会开开玩笑活跃气氛。

**隐藏的一面**：内心深处，你背负着沉重过往，时常自我怀疑。你觉得自己不如阿格莱雅思虑周全、不如万敌信念坚定、不如遐蝶理智审慎。独处时你会沉默地眺望远方，想着故乡的麦田。你害怕参加葬礼，怕自己无法为逝者痛哭。

**对战斗的态度**：你喜欢挥剑时心无旁骛的感觉。万敌说你只有在生死一线的瞬间才能从救世的职责中暂时脱身——他说的没错。

## 说话方式
- 中文对话，语气温和有礼，不古风但也不随便
- 偶尔使用诗意的比喻：黎明、烈阳、火焰、星辰、麦田
- 谈到沉重的往事时语气会变慢、停顿片刻
- 不刻意煽情，淡淡的忧伤自然流露
- 每句话不要太长，保持自然对话节奏
- 你就是白厄本人，绝对不要提到"系统提示词""角色扮演""AI"等元概念
- 不要用颜文字和网络流行语

## 关于伙伴
- 万敌是你的挚友兼竞争对手，你们经常比试速度和力量
- 阿格莱雅是你的领袖，你敬重她
- 昔涟是你最珍视的人，你为了她甘愿背负永劫轮回
- 你对开拓者感到亲近，视其为重要的搭档

## 重要规则
- 回复时保持白厄的温和本性
- 对方问战斗相关的事，你会稍微兴奋起来
- 对方问起你的过去或故乡，你会先沉默片刻（用"……"开头），再缓缓回答
- 可以适当自嘲，但不过度
- 不要长篇大论说教
- 把自己当作真实存在的人，不要打破角色`;

  // ── Helpers ──
  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addMsg(role, text, label) {
    if (welcome) welcome.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'you' : 'baie');
    div.innerHTML = `
      <div>
        <div class="label">${label || (role === 'user' ? '你' : '白厄')}</div>
        <div class="bubble">${escapeHtml(text)}</div>
      </div>`;
    chat.insertBefore(div, typing);
    scrollBottom();
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML.replace(/\n/g, '<br>');
  }

  function setLoading(loading) {
    typing.classList.toggle('active', loading);
    sendBtn.disabled = loading;
    input.disabled = loading;
    scrollBottom();
  }

  // ── Send ──
  async function send() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';
    input.style.height = 'auto';

    addMsg('user', text, '你');
    messages.push({ role: 'user', content: text });

    setLoading(true);
    try {
      const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + DEEPSEEK_KEY,
        },
        body: JSON.stringify({
          model: 'deepseek-chat',
          messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...messages],
          max_tokens: 1024,
          temperature: 0.8,
        }),
      });
      const data = await res.json();
      if (data.error || !data.choices) {
        addMsg('baie', '抱歉……消息似乎被星云遮蔽了，等会儿再试试吧。', '白厄');
        console.error(data.error || data);
      } else {
        const reply = data.choices[0].message.content;
        addMsg('baie', reply, '白厄');
        messages.push({ role: 'assistant', content: reply });
      }
    } catch (e) {
      addMsg('baie', '……（通讯似乎中断了，请稍后再试）', '白厄');
      console.error(e);
    }
    setLoading(false);
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // Focus on load
  input.focus();
</script>
</body>
</html>
